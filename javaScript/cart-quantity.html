<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cart Quantity</title>
</head>

<body>
    <p>
        Cart Quantity
    </p>

    <button>Show Quantity</button>
    <button>Add to Cart</button>
    <button>+2</button>
    <button>+3</button>
    <button>Reset Cart</button>

    <script>
        let cartQuantity = 0;

        const button = document.querySelectorAll("button");
        button.forEach(btn => {
            const textContent = btn.textContent;

            btn.addEventListener("click", () => {
                if (textContent == "Show Quantity") {
                    console.log(`Cart Quantity: ${cartQuantity}`);
                }
                else if (textContent == "Add to Cart") {
                    cartQuantity += 1;
                    console.log(`Cart Quantity: ${cartQuantity}`);
                }
                else if (textContent == "+2") {
                    cartQuantity += 2;
                    console.log(`Cart Quantity: ${cartQuantity}`);
                }
                else if (textContent == "+3") {
                    cartQuantity += 3;
                    console.log(`Cart Quantity: ${cartQuantity}`);
                }
                else {
                    cartQuantity = 0;
                    console.log(`Cart Reset \nCart Quantity: ${cartQuantity}`);
                }
            })
        })
    </script>
</body>

</html>
