<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <main class="bg-gradient">
        <div class="position-relative my-6 border-light align-center d-flex flex-column align-items-center">
            <p class="title text-info">Rock Paper Scissors</p>

            <div class="buttons">
                <div class="button-container">
                    <img class="img" src="images/rock-emoji.svg" alt="" srcset="">
                    <button value="rock" class="game btn btn-primary">Rock</button>
                </div>
                <div class="button-container">
                    <img class="img" src="images/paper-emoji.svg" alt="" srcset="">
                    <button value="paper" class="game btn btn-success">Paper</button>
                </div>
                <div class="button-container">
                    <img class="img" src="images/scissors-emoji-2.jpg" alt="" srcset="">
                    <button value="scissors" class="game btn btn-info">Scissors</button>
                </div>
            </div>

            <div id="thinking-area" class="hidden fadeIn">
                <p id="thinking-text">Computer is thinking...</p>
                <div id="spinner" class="spinner"></div>
            </div>
            <div id="results-area" class="text-center">
                <div id="result" class=""></div>
                <div id="moves"></div>
            </div>
            <div id="scores"></div>
            <button class="btn btn-secondary" id="reset-score">Reset Score</button>
        </div>

    </main>


    <script src="js/game.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
        crossorigin="anonymous"></script>
</body>

</html>
